<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Map</title>
<link rel="icon" href="assets/Pokeball.png">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0a0a12; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif;
  }
  #mapRoot { height: 100vh; box-sizing: border-box; }

  /* container-type:size lets .map-bg/.map-empty-bg below size themselves
     off THIS element's own actual pixel box (via cqw/cqh) rather than the
     viewport -- needed for their own rotate-90 trick (see their comment)
     to come out exact regardless of what this page ends up embedded in. */
  .map-stage { position: relative; width: 100%; height: 100%; overflow: hidden; container-type: size; }

  /* Only these two *static* background images rotate via a live CSS
     transform now -- the board is conceptually portrait (see
     routes_combat.py's default 10x16 grid) but the table's screen is
     landscape. .map-grid/.map-tokens below used to rotate the same way as
     part of one shared .map-rotor wrapper, but that meant the browser had
     to flatten the whole grid+tokens+autoplaying sprite-video layer into a
     single offscreen bitmap on every frame just to rotate it -- on the
     kiosk TV stick's weaker Android WebView renderer that offscreen layer
     gets rasterized below the screen's real resolution before being
     stretched back out, which is what showed up as pixelated tokens.
     Grid/tokens now compute their positions pre-rotated in the math
     instead (see battle-map.js's screenCellRect and updateGrid), so they
     render directly in the screen's real orientation with no transform and
     no forced rasterization. A static (non-animated) background image
     doesn't have that live-recomposite cost, so it keeps the simple
     transform approach. Pre-rotation each box is sized HEIGHTxWIDTH
     (swapped, via cqh/cqw) so that after the 90-degree turn it exactly
     fills the stage's actual WIDTHxHEIGHT with no gaps or overflow --
     sizing it WIDTHxHEIGHT like the stage itself would rotate into a
     HEIGHTxWIDTH box instead, either leaving letterbox gaps or
     overflowing, depending on which side is longer. */
  .map-bg, .map-empty-bg {
    position: absolute; top: 50%; left: 50%;
    width: 100cqh; height: 100cqw;
    transform: translate(-50%, -50%) rotate(90deg);
    background-size: cover; background-position: center;
  }

  .map-bg { display: none; }
  .map-stage.has-bg .map-bg { display: block; }

  /* Same look as the in-app map (js/utils/battle-map-view.js), minus the costly bits (no blur, no looping
     animations) -- this page runs on a weak TV-stick renderer. Hairline grid, square side-framed tokens with a
     facing arrowhead, tinted terrain zones. */
  .map-stage { background: radial-gradient(ellipse at 50% 35%, #161a33 0%, #0a0c1c 60%, #05060e 100%); }
  .map-grid { position: absolute; inset: 0; display: grid; gap: 0; background: transparent; }
  .map-cell { box-shadow: inset 0 0 0 0.5px rgba(140,170,255,0.13); }
  .map-stage.has-bg .map-cell { box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.22); }
  .map-cell.marked {
    background: rgba(214,160,70,0.2); display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; color: #f0d090; overflow: hidden; text-overflow: ellipsis;
    padding: 2px; text-align: center; box-sizing: border-box; box-shadow: inset 0 0 0 1px rgba(214,160,70,0.5);
  }
  .map-cell[class*="zone-"] {
    background: repeating-linear-gradient(45deg, rgba(var(--zc), 0.16) 0 6px, rgba(var(--zc), 0.05) 6px 12px);
    box-shadow: inset 0 0 0 1px rgba(var(--zc), 0.5), inset 0 0 10px rgba(var(--zc), 0.25);
  }
  .map-cell.zone-electric { --zc: 247,208,44; } .map-cell.zone-grassy { --zc: 82,200,90; }
  .map-cell.zone-misty { --zc: 242,154,200; } .map-cell.zone-psychic { --zc: 232,80,156; } .map-cell.zone-other { --zc: 127,166,255; }
  .map-cell.zone-sunny { --zc: 255,170,60; } .map-cell.zone-rain { --zc: 80,150,255; } .map-cell.zone-sandstorm { --zc: 214,176,100; } .map-cell.zone-hail { --zc: 170,225,255; }
  .map-stage.global-electric { --zc: 247,208,44; } .map-stage.global-grassy { --zc: 82,200,90; }
  .map-stage.global-misty { --zc: 242,154,200; } .map-stage.global-psychic { --zc: 232,80,156; } .map-stage.global-other { --zc: 127,166,255; }
  .map-stage.global-sunny { --zc: 255,170,60; } .map-stage.global-rain { --zc: 80,150,255; } .map-stage.global-sandstorm { --zc: 214,176,100; } .map-stage.global-hail { --zc: 170,225,255; }
  .map-stage[class*="global-"].active::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    box-shadow: inset 0 0 50px rgba(var(--zc), 0.45); background: rgba(var(--zc), 0.06);
  }
  .bmap-legend { position: absolute; left: 12px; bottom: 12px; z-index: 5; display: flex; flex-wrap: wrap; gap: 0.4rem; max-width: 80%; }
  .bmap-legend:empty { display: none; }
  .bmap-legend-chip {
    display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.95rem; font-weight: 600; padding: 0.3rem 0.8rem; border-radius: 999px;
    color: #e8ecff; background: rgba(10,12,28,0.82); border: 1px solid rgba(var(--zc), 0.65);
  }
  .bmap-legend-chip i { width: 10px; height: 10px; border-radius: 50%; background: rgb(var(--zc)); }
  .bmap-legend-chip small { font-weight: 500; opacity: 0.7; }

  /* Idle state -- no active battle, shown in place of the grid/tokens (see
     js/pages/battle-map.js's render, which just toggles .map-stage's own
     .active class rather than swapping any markup). Sits last in the stage
     so it paints over the grid's own always-on dark background -- a map of
     the Shiman region, replacing the TitleScreen.png placeholder this
     started as. */
  .map-empty-bg {
    display: none;
    background-image: url('assets/Shiman Federation.png');
  }
  .map-stage:not(.active) .map-empty-bg { display: block; }

  .map-tokens { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
  /* This screen's cells aren't square (the board stretches to fill the TV), so the token tile is sized off the
     token box's smaller side (container query) instead of filling it -- otherwise the sprite would stretch. */
  .map-token {
    position: absolute; display: flex; align-items: center; justify-content: center; container-type: size;
    padding: 4px; box-sizing: border-box; --ring: 200,200,220; transition: left 0.28s ease, top 0.28s ease;
  }
  .map-disk { position: relative; width: min(100cqw, 100cqh); height: min(100cqw, 100cqh); }
  .map-token.player { --ring: 93,173,226; }
  .map-token.enemy { --ring: 231,115,115; }
  /* Portrait is a round disk with a side-coloured ring; the sprite inside stays upright. Side used to be an outline. */
  .map-token-portrait {
    position: absolute; inset: 0; border-radius: 14%; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.14), rgba(8,10,22,0.7) 75%);
    box-shadow: 0 0 0 3px rgba(var(--ring), 0.9), 0 0 14px rgba(var(--ring), 0.7), inset 0 0 10px rgba(0,0,0,0.5);
  }
  /* Altitude: a flyer is drawn lifted off its tile with a shadow below and a badge (battle-map.js). */
  .map-token.airborne .map-token-portrait { transform: translateY(-14%); }
  .map-token.airborne .map-disk::before {
    content: ''; position: absolute; left: 14%; right: 14%; bottom: 3%; height: 16%; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.65), rgba(0,0,0,0) 70%);
  }
  /* Burrowed underground (below 0): sunk into the tile, earthy and dimmed. */
  .map-token.burrowed .map-token-portrait { transform: translateY(10%); filter: sepia(0.6) brightness(0.65); box-shadow: 0 0 0 3px rgba(150,110,60,0.95), inset 0 -10px 14px rgba(70,45,20,0.8); }
  .map-token.burrowed .map-alt { background: rgb(176,130,72); }
  .map-alt {
    position: absolute; top: -2px; right: -2px; z-index: 3; font-size: 0.8rem; font-weight: 800; line-height: 1;
    padding: 0.2rem 0.45rem; border-radius: 999px; color: #0b0d1a; background: rgb(var(--ring));
  }
  /* The sprite turns inside its fixed frame to show the facing (battle-map.js sets the transform, +90deg because
     this board is shown rotated). */
  .map-sprite { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; transition: transform 0.25s ease; }
  .map-sprite img, .map-sprite video { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.85)); }
</style>
</head>
<body>
  <div id="mapRoot">
    <div class="map-stage" id="mapStage">
      <div class="map-bg" id="mapBg"></div>
      <div class="map-grid" id="mapGrid"></div>
      <div class="map-tokens" id="mapTokens"></div>
      <div class="bmap-legend" id="mapLegend"></div>
      <div class="map-empty-bg" id="mapEmptyBg"></div>
    </div>
  </div>
  <script type="module" src="js/pages/battle-map.js"></script>
</body>
</html>
