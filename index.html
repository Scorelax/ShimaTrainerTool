<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pokemon D&D Trainer Management Tool">
  <title>Pokemon D&D Trainer Tool</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/AppIcon.png">

  <!-- PWA Support -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FF6B6B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pokemon D&D">
  <link rel="apple-touch-icon" href="assets/AppIcon.png">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Preload title screen for instant display -->
  <link rel="preload" as="image" href="assets/TitleScreen.png">

  <!-- Preconnect to API -->
  <link rel="preconnect" href="https://script.google.com">
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen" class="loading-screen active">
    <div class="pokeball-loader"></div>
    <p>Loading your adventure...</p>
    <div id="loading-sprite-reveal" class="loading-sprite-reveal">
      <div id="loading-sprite-media" class="loading-sprite-media"></div>
      <div id="loading-sprite-caption" class="loading-sprite-caption"></div>
    </div>
    <div class="loading-progress-container">
      <div class="loading-progress-bar">
        <div id="loading-progress-fill" class="loading-progress-fill"></div>
        <span id="loading-progress-text" class="loading-progress-text">Preparing...</span>
      </div>
    </div>
  </div>

  <!-- Idle Splash Screensaver -->
  <div id="idle-overlay" class="idle-overlay"></div>

  <!-- Main App -->
  <div id="app" class="app hidden">
    <!-- Navigation -->
    <nav class="main-nav">
      <div class="nav-brand">
        <img src="assets/Pokeball.png" alt="Pokeball" class="nav-logo" onerror="this.style.display='none'">
        <h1>Pokemon D&D</h1>
      </div>

      <ul class="nav-menu">
        <li><a href="#home" data-route="home" class="nav-link active">Home</a></li>
        <li><a href="#trainers" data-route="trainers" class="nav-link">Trainers</a></li>
        <li><a href="#pokemon" data-route="pokemon" class="nav-link">Pokemon</a></li>
        <li><a href="#pokedex" data-route="pokedex" class="nav-link">Pokedex</a></li>
      </ul>

      <!-- Offline Indicator -->
      <div id="offline-indicator" class="offline-indicator hidden">
        <span>📡 Offline Mode</span>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main id="content" class="content">
      <!-- Content will be dynamically loaded here -->
    </main>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <!-- Error Screen -->
  <div id="error-screen" class="error-screen hidden">
    <h2>⚠️ Something went wrong</h2>
    <p id="error-message"></p>
    <button onclick="location.reload()">Retry</button>
  </div>

  <!-- Boot watchdog: if a transient network hiccup (e.g. Tailscale still
       reconnecting) makes main.js -- or one of the modules it imports --
       fail to load, the whole app silently never runs, leaving this page
       frozen on the loading screen's default "Preparing..." text forever
       with no feedback. This is a plain inline script (not a module import)
       so it always runs regardless of what main.js does. initApp() clears
       it once boot actually succeeds; if it's still armed after 10s, boot
       never completed, so offer a tap-to-retry instead of a silent freeze. -->
  <script>
    window.__bootWatchdog = setTimeout(() => {
      const loadingScreen = document.getElementById('loading-screen');
      if (!loadingScreen || !loadingScreen.classList.contains('active')) return;
      const text = document.getElementById('loading-progress-text');
      if (text) text.textContent = 'Taking longer than expected -- tap to retry';
      loadingScreen.style.cursor = 'pointer';
      loadingScreen.addEventListener('click', () => location.reload(), { once: true });
    }, 10000);
  </script>

  <!-- Scripts -->
  <script type="module" src="js/main.js"></script>

  <!-- Service worker: no caching, registered purely so Android Chrome
       treats the app as installable ("Add to Home Screen") -- see sw.js.
       updateViaCache: 'none' so the browser never trusts HTTP cache when
       checking sw.js itself for changes. -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
        .then(reg => console.log('[PWA] Service worker registered:', reg.scope))
        .catch(err => console.log('[PWA] Service worker registration failed:', err));
    }
    // One-time cleanup: purge any Cache Storage buckets left behind by the
    // old cache-first service worker -- this one never writes to Cache
    // Storage, so those would otherwise be orphaned dead weight forever.
    if ('caches' in window) {
      caches.keys().then(names => names.forEach(name => caches.delete(name)));
    }
  </script>
</body>
</html>
