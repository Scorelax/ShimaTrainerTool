<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DM Console</title>
<link rel="icon" href="assets/AppIcon-small.png">
<!-- The player app's stylesheet: the battle screen mounted in the middle (combat-wip.js) and its popups rely on it. -->
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/dm-console.css">
<!-- PokeNav's region map (everything under .rmap). -->
<link rel="stylesheet" href="css/region-map.css">
<!-- The Pokedex module's fonts (the players' Pokedex look), loaded without holding up the page. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
</head>
<body class="dm-console">
  <div class="dm-app">
    <header class="dm-topbar">
      <div class="dm-brand"><img src="assets/AppIcon-small.png" alt=""><span>DM Console</span></div>
      <div class="dm-status" id="dmStatus">Connecting…</div>
      <!-- The world clock and weather, plus timers that are pinned or done (world-clock.js). -->
      <div class="dm-topbar-widgets" id="dmTopWidgets"></div>
    </header>

    <nav class="dm-rail" id="dmRail">
      <button class="dm-rail-btn active" data-module="battle" title="Battle -- map setup, encounter setup and post battle"><img src="assets/VS-small.png" alt="">Battle</button>
      <button class="dm-rail-btn" data-module="party" title="Party"><img src="assets/party-icon.png" alt="">Party</button>
      <button class="dm-rail-btn" data-module="pokedex" title="Pokédex"><img src="assets/pokedex.png" alt="">Pokédex</button>
      <button class="dm-rail-btn" data-module="npcs" title="NPCs"><span>👤</span>NPCs</button>
      <button class="dm-rail-btn" data-module="clock" title="Clock"><span>🕰️</span>Clock</button>
      <button class="dm-rail-btn" data-module="pokenav" title="PokéNav -- the table screen outside a battle: the region map, or the adventure map the players walk around on"><img src="assets/pokenav-icon.png" alt="">PokéNav</button>
      <button class="dm-rail-btn" data-module="display" title="Display -- the backgrounds and pictures on the display"><span>📺</span>Display</button>
      <button class="dm-rail-btn" data-module="admin" title="Admin -- add and edit items, Pokédex entries and splash screens, with their pictures"><span>🛠️</span>Admin</button>
    </nav>

    <main class="dm-main">
      <section class="dm-module dm-view" id="dmModuleParty" hidden></section>
      <section class="dm-module" id="dmModulePokedex" hidden></section>
      <section class="dm-module" id="dmModuleNpcs" hidden></section>
      <section class="dm-module" id="dmModuleClock" hidden></section>
      <section class="dm-module dm-navmod-module" id="dmModulePokenav" hidden></section>
      <section class="dm-module" id="dmModuleDisplay" hidden></section>
      <section class="dm-module dm-admin-module" id="dmModuleAdmin" hidden></section>
      <section class="dm-module dm-battle-module" id="dmModuleBattle">
        <!-- No battle running: the map and where everyone starts, who's in the battle (the encounters), the last battle's
             rewards. -->
        <div class="dm-enc-tabs" id="dmBattleTabs">
          <button data-btab="setup" class="active">🌿 Map setup</button>
          <button data-btab="library"><img class="dm-tab-icon" src="assets/VS-small.png" alt="">Encounter setup</button>
          <button data-btab="aftermath">🏁 Post battle<span class="dm-tab-dot" id="dmAfterDot" hidden title="The last battle's post battle isn't done yet"></span></button>
        </div>
        <!-- A battle running: three tabs (battle-live.js) -- the battle itself, its map, and Encounter setup (to build the
             next one meanwhile). -->
        <div class="dm-enc-tabs" id="dmLiveTabs" hidden>
          <button data-ltab="battle" class="active"><img class="dm-tab-icon" src="assets/VS-small.png" alt="">Battle</button>
          <button data-ltab="map">🗺️ Map</button>
          <button data-ltab="encounters">📋 Encounter setup</button>
        </div>
        <div class="dm-view" id="dmView"><div class="dm-loading">Loading…</div></div>
        <div class="dm-tabview" id="dmEncView" hidden></div>
        <!-- The Battle tab: combat-wip.js renders the shared battle here, as the DM (must be #content). -->
        <div class="dm-battle" id="dmLive" hidden>
          <div class="dm-battle-stage" id="content"></div>
          <aside class="dm-tools" id="dmTools"></aside>
        </div>
        <!-- The Map tab: the battle map (moves, cones, lines, like the players') or the live map editor. -->
        <div class="dm-live-map" id="dmLiveMap" hidden></div>
      </section>
    </main>
  </div>
  <script type="module" src="js/dm/dm-console.js"></script>
</body>
</html>
