<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shima Display</title>
<link rel="icon" href="assets/AppIcon.png">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0a0a12; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif;
  }
  /* The DM's scene (background of wherever the players are + pictures, js/utils/display-scene.js) fills the screen at 16:9. */
  #sceneStage {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16));
  }

  /* Nothing set up in the DM console's Display yet: the title screen. */
  #idleLogo { position: fixed; inset: 0; background: url("assets/TitleScreen.png") center / cover no-repeat; }
  #idleLogo[hidden] { display: none; }

  /* During a battle, on top of the background: whoever's turn it is, big, and the turn order along the bottom. */
  #battleLayer {
    position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; box-sizing: border-box; padding: 1.5rem 2rem 1.25rem;
    background: linear-gradient(to top, rgba(6, 6, 12, 0.82) 0, rgba(6, 6, 12, 0.35) 24%, rgba(6, 6, 12, 0) 45%);
  }
  #battleLayer[hidden] { display: none; }

  .display-round {
    align-self: flex-start; font-size: 1.15rem; font-weight: 700; color: #FFD700; text-transform: uppercase; letter-spacing: 2px;
    background: rgba(10, 10, 18, 0.7); padding: 0.3rem 0.9rem; border-radius: 10px;
  }

  .display-spotlight { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .display-spotlight-card { display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: center; }
  .display-spotlight-card[hidden] { display: none; }
  .display-spotlight-portrait { width: min(56vh, 600px); height: min(56vh, 600px); display: flex; align-items: center; justify-content: center; }
  .display-spotlight-portrait img, .display-spotlight-portrait video {
    max-width: 100%; max-height: 100%; border-radius: 18px;
    filter: drop-shadow(0 0 28px rgba(255, 215, 0, 0.45)) drop-shadow(0 10px 30px rgba(0, 0, 0, 0.6));
  }
  .display-spotlight-plate {
    margin-top: 0.9rem; text-align: center; background: rgba(10, 10, 18, 0.78); border: 2px solid rgba(255, 215, 0, 0.55);
    border-radius: 14px; padding: 0.45rem 1.6rem 0.6rem; min-width: 300px;
  }
  .display-spotlight-turn { font-size: 0.85rem; font-weight: 700; color: #FFD700; text-transform: uppercase; letter-spacing: 2px; }
  .display-spotlight-name { font-size: 2rem; font-weight: 700; line-height: 1.2; }
  .display-spotlight-bars { width: 300px; margin: 0.35rem auto 0; }
  .display-spotlight-bars:empty { display: none; }

  .display-strip { display: flex; justify-content: center; gap: 0.75rem; padding-top: 0.75rem; }
  .display-strip-card {
    position: relative; flex: 0 1 120px; min-width: 0; text-align: center; padding: 0.5rem;
    border-radius: 12px; border: 2px solid rgba(255, 255, 255, 0.08); background: rgba(16, 16, 28, 0.82);
  }
  .display-strip-card.active { border-color: #FFD700; background: rgba(60, 52, 10, 0.9); box-shadow: 0 0 18px rgba(255, 215, 0, 0.35); }
  .display-strip-card.spectating { opacity: 0.4; }
  .display-strip-portrait { width: 84px; height: 84px; margin: 0 auto; }
  .display-strip-portrait img, .display-strip-portrait video { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; }
  .display-strip-name { font-size: 0.85rem; font-weight: 600; margin-top: 0.3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .display-strip-level { font-size: 0.72rem; color: #a0a0c0; }
  .display-strip-reaction {
    position: absolute; top: 3px; right: 5px; font-size: 0.85rem;
    filter: grayscale(1) opacity(0.35);
  }
  .display-strip-reaction.used { filter: none; }
  .display-strip-bonus {
    position: absolute; top: 3px; left: 5px; font-size: 0.85rem;
    filter: grayscale(1) opacity(0.35);
  }
  .display-strip-bonus.used { filter: none; }

  .display-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.15); overflow: hidden; margin-top: 0.25rem; }
  .display-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s ease; }
  .display-bar.hp .display-bar-fill { background: #2ecc71; }
  .display-bar.vp .display-bar-fill { background: #3498db; }

  .display-anim-overlay {
    position: fixed; inset: 0; background: none; /* the background stays -- the animation plays over it */
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  /* Only while a move animation plays -- display:flex above would otherwise beat the hidden attribute and leave this
     92%-black layer over the whole screen all the time. */
  .display-anim-overlay[hidden] { display: none; }
  .display-anim-overlay video { max-width: 90vw; max-height: 90vh; }
</style>
</head>
<body>
  <div id="sceneStage"></div>
  <div id="idleLogo" hidden></div>
  <div id="battleLayer" hidden></div>
  <div class="display-anim-overlay" id="animOverlay" hidden></div>
  <script type="module" src="js/pages/display.js"></script>
</body>
</html>
