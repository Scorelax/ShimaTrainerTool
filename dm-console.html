<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DM Console</title>
<link rel="icon" href="assets/AppIcon.png">
<!-- The player app's stylesheet: the battle screen mounted in the middle (combat-wip.js) and its popups rely on it. -->
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/dm-console.css">
</head>
<body class="dm-console">
  <div class="dm-app">
    <header class="dm-topbar">
      <div class="dm-brand"><img src="assets/AppIcon.png" alt=""><span>DM Console</span></div>
      <div class="dm-status" id="dmStatus">Connecting…</div>
      <!-- What the display shows (display.js) -- backgrounds and pictures, set up in the Display module. -->
      <button class="dm-top-display" id="dmDisplayBtn" title="What the display shows -- backgrounds and pictures">📺 Display</button>
      <!-- The world clock and weather, plus timers that are pinned or done (world-clock.js). -->
      <div class="dm-topbar-widgets" id="dmTopWidgets"></div>
    </header>

    <nav class="dm-rail" id="dmRail">
      <button class="dm-rail-btn active" data-module="battle" title="Battle -- map setup, encounter setup and post battle"><img src="assets/VS.png" alt="">Battle</button>
      <button class="dm-rail-btn" data-module="party" title="Party"><span>👥</span>Party</button>
      <button class="dm-rail-btn" data-module="pokedex" title="Pokédex"><span>📖</span>Pokédex</button>
      <button class="dm-rail-btn" data-module="npcs" title="NPCs"><span>🎭</span>NPCs</button>
      <button class="dm-rail-btn" data-module="clock" title="Clock"><span>🕰️</span>Clock</button>
      <button class="dm-rail-btn" data-module="reference" disabled title="Coming later"><span>📚</span>Reference</button>
    </nav>

    <main class="dm-main">
      <section class="dm-module dm-view" id="dmModuleParty" hidden></section>
      <section class="dm-module" id="dmModulePokedex" hidden></section>
      <section class="dm-module" id="dmModuleNpcs" hidden></section>
      <section class="dm-module" id="dmModuleClock" hidden></section>
      <section class="dm-module" id="dmModuleDisplay" hidden></section>
      <section class="dm-module dm-battle-module" id="dmModuleBattle">
        <!-- No battle running: the map and where everyone starts, who's in the battle (the encounters), the last battle's
             rewards. -->
        <div class="dm-enc-tabs" id="dmBattleTabs">
          <button data-btab="setup" class="active"><img class="dm-tab-icon" src="assets/VS.png" alt="">Map setup</button>
          <button data-btab="library">🌿 Encounter setup</button>
          <button data-btab="aftermath">🏁 Post battle<span class="dm-tab-dot" id="dmAfterDot" hidden title="The last battle's post battle isn't done yet"></span></button>
        </div>
        <div class="dm-view" id="dmView"><div class="dm-loading">Loading…</div></div>
        <div class="dm-tabview" id="dmEncView" hidden></div>
        <!-- A battle running: combat-wip.js renders the shared battle here, as the DM (must be #content). -->
        <div class="dm-battle" id="dmLive" hidden>
          <div class="dm-battle-stage" id="content"></div>
          <aside class="dm-tools" id="dmTools"></aside>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="js/dm/dm-console.js"></script>
</body>
</html>
