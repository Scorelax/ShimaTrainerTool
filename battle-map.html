<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Map</title>
<link rel="icon" href="assets/Pokeball.png">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0a0a12; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif;
  }
  #mapRoot { height: 100vh; box-sizing: border-box; }
  .map-empty { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 1.6rem; color: #a0a0c0; }

  /* container-type:size lets .map-rotor below size itself off THIS
     element's own actual pixel box (via cqw/cqh) rather than the viewport
     -- needed for the rotate-90 trick to come out exact regardless of what
     this page ends up embedded in. */
  .map-stage { position: relative; width: 100%; height: 100%; overflow: hidden; container-type: size; }

  /* Background, grid and tokens all live inside this one rotor so they
     rotate together as a single aligned unit -- the board is conceptually
     portrait (see routes_combat.py's default 10x16 grid) but the table's
     screen is landscape, so this always rotates 90 clockwise regardless of
     whether a background image happens to be set. Without this, the grid/
     tokens stayed unrotated while only the background (previously rotated
     on its own) turned, so the two no longer lined up. Pre-rotation the
     box is sized HEIGHTxWIDTH (swapped, via cqh/cqw) so that after the
     90-degree turn it exactly fills the stage's actual WIDTHxHEIGHT with
     no gaps or overflow -- sizing it WIDTHxHEIGHT like the stage itself
     would rotate into a HEIGHTxWIDTH box instead, either leaving letterbox
     gaps or overflowing, depending on which side is longer. */
  .map-rotor {
    position: absolute; top: 50%; left: 50%;
    width: 100cqh; height: 100cqw;
    transform: translate(-50%, -50%) rotate(90deg);
  }

  .map-bg { position: absolute; inset: 0; display: none; background-size: cover; background-position: center; }
  .map-stage.has-bg .map-bg { display: block; }

  .map-grid { position: absolute; inset: 0; display: grid; gap: 2px; background: #1a1a24; }
  .map-stage.has-bg .map-grid { background: rgba(26,26,36,0.35); }
  .map-cell { background: #20202e; }
  .map-stage.has-bg .map-cell { background: rgba(32,32,46,0.35); }
  .map-cell.marked {
    background: #4a3520; display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; color: #e0c080; overflow: hidden; text-overflow: ellipsis;
    padding: 2px; text-align: center; box-sizing: border-box;
  }

  .map-tokens { position: absolute; inset: 0; pointer-events: none; }
  .map-token {
    position: absolute; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 4px; box-sizing: border-box;
  }
  /* Portrait fills the whole footprint -- no name label to leave room for
     (see js/pages/battle-map.js, a title attribute covers identification
     for anyone actually interacting with this screen). Side, previously
     conveyed by the name's text color, moves to an outline instead. */
  .map-token-portrait { width: 100%; height: 100%; }
  .map-token-portrait img, .map-token-portrait video {
    width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 6px rgba(0,0,0,0.8));
  }
  .map-token.player .map-token-portrait { outline: 2px solid rgba(93,173,226,0.55); outline-offset: -2px; border-radius: 4px; }
  .map-token.enemy .map-token-portrait { outline: 2px solid rgba(231,115,115,0.55); outline-offset: -2px; border-radius: 4px; }
</style>
</head>
<body>
  <div id="mapRoot"><div class="map-empty">Loading…</div></div>
  <script type="module" src="js/pages/battle-map.js"></script>
</body>
</html>
